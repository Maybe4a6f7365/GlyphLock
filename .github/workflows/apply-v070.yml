name: Apply GlyphLock v0.7 semantic compositions

on:
  push:
    branches:
      - feature/morph-quality-v070
    paths:
      - .github/workflows/apply-v070.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          # The repair chunks replace the accidentally staged legacy part01.
          cat \
            .bootstrap/glyphlock-v070-source.tar.xz.b64.part00 \
            .bootstrap/glyphlock-v070-source.tar.xz.b64.part01a \
            .bootstrap/glyphlock-v070-source.tar.xz.b64.part01b \
            .bootstrap/glyphlock-v070-source.tar.xz.b64.part02 \
            .bootstrap/glyphlock-v070-source.tar.xz.b64.part03 \
            .bootstrap/glyphlock-v070-source.tar.xz.b64.part04 \
            .bootstrap/glyphlock-v070-source.tar.xz.b64.part05 \
            .bootstrap/glyphlock-v070-source.tar.xz.b64.part06 \
            .bootstrap/glyphlock-v070-source.tar.xz.b64.part07a \
            .bootstrap/glyphlock-v070-source.tar.xz.b64.part07b \
            > /tmp/glyphlock-v070-source.tar.xz.b64
          base64 --decode /tmp/glyphlock-v070-source.tar.xz.b64 > /tmp/glyphlock-v070-source.tar.xz
          echo "13886a412b3d2b1eea206e43dc22d6886f913887be5b2d5f72558c570c2e29c8  /tmp/glyphlock-v070-source.tar.xz" | sha256sum --check --strict

      - name: Import semantic composition pass
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/glyphlock-v070-source.tar.xz -C .
          rm -rf .bootstrap

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "No v0.7 source changes to commit."
            exit 0
          fi

          git commit -m "feat: add semantic composition grammars and two new art systems"
          git push origin HEAD:feature/morph-quality-v070
