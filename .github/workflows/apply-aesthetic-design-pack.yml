name: Apply aesthetic design pack v0.6

on:
  push:
    branches:
      - feature/aesthetic-design-pack-v06
    paths:
      - .github/workflows/apply-aesthetic-design-pack.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify patch script
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/aesthetic-design-pack.xz.part* > /tmp/aesthetic-design-pack.py.xz.b64
          base64 --decode /tmp/aesthetic-design-pack.py.xz.b64 > /tmp/aesthetic-design-pack.py.xz
          echo "c5e458f8819b1ebe96c4376ad550dde6dcc585558e45e3fcacd4b137a097ff74  /tmp/aesthetic-design-pack.py.xz" | sha256sum --check --strict
          xz --decompress --stdout /tmp/aesthetic-design-pack.py.xz > /tmp/apply_aesthetic_design_pack_v06.py
          echo "85404b610b2050062f9b0241a06e2293ea2c3a11268e191e43dc9c20a10c2b97  /tmp/apply_aesthetic_design_pack_v06.py" | sha256sum --check --strict
          python -m py_compile /tmp/apply_aesthetic_design_pack_v06.py

      - name: Apply and commit
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply_aesthetic_design_pack_v06.py
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: add six procedural aesthetic wallpaper systems"
          git push origin HEAD:feature/aesthetic-design-pack-v06
