name: Apply visual quality patch

on:
  push:
    branches:
      - feature/visual-quality-pass
    paths:
      - .github/workflows/apply-quality-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/quality.patch.gz.b64.part* > /tmp/quality.patch.gz.b64
          base64 --decode /tmp/quality.patch.gz.b64 > /tmp/quality.patch.gz
          echo "60dfd19163c172cb6c8774f648f97bad95f1a2b79ae382e0407bd66ea5021ff4  /tmp/quality.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout /tmp/quality.patch.gz > /tmp/quality.patch
          echo "40725fbff628d6c6b1769ed9c3501eb56f85e4a453fac9d8c1aa2b55d7676acf  /tmp/quality.patch" | sha256sum --check --strict

      - name: Apply and commit quality pass
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/quality.patch
          git apply --index /tmp/quality.patch
          rm -rf .bootstrap

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: add Lux rendering profile and staggered glyph morphs"
          git push origin HEAD:feature/visual-quality-pass
