name: Bootstrap source import

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-import.yml

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part* > /tmp/glyphlock-source.tar.gz.b64
          base64 --decode /tmp/glyphlock-source.tar.gz.b64 > /tmp/glyphlock-source.tar.gz
          echo "4a1a7d2dd875d4961e72cfecf151493bddf5ae5ac560dae9e2b86cfc15c28f15  /tmp/glyphlock-source.tar.gz" | sha256sum --check --strict

      - name: Import Prototype 0 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/glyphlock-source
          tar -xzf /tmp/glyphlock-source.tar.gz -C /tmp/glyphlock-source

          # GitHub Actions tokens cannot create or modify workflow files. Import
          # the application source first; CI is installed separately through
          # the authenticated GitHub connector after this one-time run.
          rsync -a --exclude '.github/workflows/' /tmp/glyphlock-source/ ./
          rm -rf .bootstrap

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi

          git commit -m "feat: import GlyphLock Prototype 0"
          git push origin HEAD:main
