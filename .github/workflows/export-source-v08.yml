name: Export source for v0.8 development

on:
  push:
    branches:
      - feature/visual-systems-v08
    paths:
      - .github/workflows/export-source-v08.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='.git' --exclude='node_modules' --exclude='**/build' -czf /tmp/glyphlock-v07-source.tar.gz .
          sha256sum /tmp/glyphlock-v07-source.tar.gz > /tmp/glyphlock-v07-source.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: glyphlock-v07-source
          path: |
            /tmp/glyphlock-v07-source.tar.gz
            /tmp/glyphlock-v07-source.tar.gz.sha256
          if-no-files-found: error
