name: GlyphLock visual systems CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/generate_scene_masks.py --jobs 3 --compress-level 6
      - run: python scripts/check_morph_first.py
      - run: python scripts/check_theme_catalog.py
      - run: python scripts/check_semantic_composition.py
      - run: python scripts/check_transport_integrity.py
      - run: python scripts/build_mask_contact_sheet.py
      - uses: actions/upload-artifact@v4
        with:
          name: glyphlock-v080-design-contact-sheet
          path: build/review/glyphlock-mask-contact-sheet.png
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: apps/visual-lab
        run: npm install --no-audit --no-fund
      - working-directory: apps/visual-lab
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: glyphlock-v080-visual-lab
          path: apps/visual-lab/dist

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/generate_scene_masks.py --jobs 3 --compress-level 6
      - run: python scripts/check_morph_first.py
      - run: python scripts/check_theme_catalog.py
      - run: python scripts/check_semantic_composition.py
      - run: python scripts/check_transport_integrity.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1
      - name: Build, test, and lint Android prototype
        id: android_build
        continue-on-error: true
        working-directory: apps/android
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/glyphlock-android-build.log"
      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glyphlock-v080-android-build-log
          path: ${{ runner.temp }}/glyphlock-android-build.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.android_build.outcome == 'success'
        with:
          name: GlyphLock-signature-systems-v080-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Fail when Android validation failed
        if: steps.android_build.outcome == 'failure'
        run: exit 1
