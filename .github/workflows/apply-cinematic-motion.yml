name: Apply cinematic motion pack

on:
  push:
    branches:
      - feature/cinematic-motion-art-pack
    paths:
      - .github/workflows/apply-cinematic-motion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/cinematic-motion.patch.gz.b64.part00 \
            .bootstrap/cinematic-motion.patch.gz.b64.part01 \
            .bootstrap/cinematic-motion.patch.gz.b64.part02a \
            .bootstrap/cinematic-motion.patch.gz.b64.part02b \
            .bootstrap/cinematic-motion.patch.gz.b64.part03 \
            > /tmp/cinematic-motion.patch.gz.b64
          echo "64de9702b0eeee5fbb3b6fee28896f9fffde887d44ca88fb768facf8aaa02d28  /tmp/cinematic-motion.patch.gz.b64" | sha256sum --check --strict
          base64 --decode /tmp/cinematic-motion.patch.gz.b64 > /tmp/cinematic-motion.patch.gz
          echo "36f0433ea444404f8ead362d6e3399e1640796f974638b7c759d9cfe07cbf985  /tmp/cinematic-motion.patch.gz" | sha256sum --check --strict
          gzip -dc /tmp/cinematic-motion.patch.gz > /tmp/cinematic-motion.patch
          echo "3e067e31a7c4012211dad77c83c578abccd8be3da856463b419a917bac418d6b  /tmp/cinematic-motion.patch" | sha256sum --check --strict

      - name: Apply source changes that match repository main
        shell: bash
        run: |
          set -euo pipefail

          EXCLUDES=(
            --exclude=.github/workflows/ci.yml
            --exclude=.gitignore
            --exclude=README.md
            --exclude=apps/android/app/build.gradle.kts
            --exclude=apps/visual-lab/dist/index.html
            --exclude=apps/visual-lab/dist/main.js
            --exclude=apps/visual-lab/dist/main.js.map
            --exclude=scripts/generate_scene_masks.py
          )

          git apply --check "${EXCLUDES[@]}" /tmp/cinematic-motion.patch
          git apply --index "${EXCLUDES[@]}" /tmp/cinematic-motion.patch
          rm -rf .bootstrap

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: add cinematic motion engine and nerd-tech art pack"
          git push origin HEAD:feature/cinematic-motion-art-pack
